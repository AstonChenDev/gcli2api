services:
  gcli2api:
    build: .
    image: gcli2api:local
    container_name: my-gcli2api
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "7861:7861"
    environment:
      - PASSWORD=${PASSWORD:-pwd}
      - PORT=${PORT:-7861}
      - HOST=${HOST:-0.0.0.0}
      # - POSTGRESQL_URI=postgresql://gcli2api:Gcli2Api_Pg%402026%21xY@43.161.255.95:15432/gcli2api
    volumes:
      - ./data/creds:/app/creds
