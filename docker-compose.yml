services:
  gcli2api:
    build: .
    image: gcli2api:local
    container_name: my-gcli2api
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "7861:7861"
      - "11452:11451"
      - "11454:11454"
    environment:
      - PASSWORD=${PASSWORD:-pwd}
      - PORT=${PORT:-7861}
      - HOST=${HOST:-0.0.0.0}
      - WORKERS=${WORKERS:-4}
      - POSTGRESQL_URI=postgresql://gcli2api:Gcli2Api_Pg%402026%21xY@43.162.94.148:15432/gcli2api
      # - POSTGRESQL_URI=postgresql://gcli2api:gcli2api_pass@host.docker.internal:15432/gcli2api
      # COS 对象存储（图片上传，未配置则使用 base64 内嵌传输）
      # - COS_SECRET_ID=your_secret_id
      # - COS_SECRET_KEY=your_secret_key
      # - COS_REGION=ap-guangzhou
      # - COS_BUCKET=your-bucket-1250000000
      # - COS_URL_PREFIX=https://your-bucket-1250000000.cos.ap-guangzhou.myqcloud.com
      # - COS_PATH_PREFIX=generated/
    volumes:
      - ./data/creds:/app/creds

  # 新版本容器（蓝绿部署用，验证通过后可替换旧容器）
  gcli2api-new:
    build: .
    image: gcli2api:new
    container_name: my-gcli2api-new
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "7862:7862"
    environment:
      - PASSWORD=${PASSWORD:-pwd}
      - PORT=7862
      - HOST=${HOST:-0.0.0.0}
      - WORKERS=${WORKERS:-4}
      - POSTGRESQL_URI=postgresql://gcli2api:Gcli2Api_Pg%402026%21xY@43.162.94.148:15432/gcli2api
      # COS 对象存储
      # - COS_SECRET_ID=your_secret_id
      # - COS_SECRET_KEY=your_secret_key
      # - COS_REGION=ap-guangzhou
      # - COS_BUCKET=your-bucket-1250000000
      # - COS_URL_PREFIX=https://your-bucket-1250000000.cos.ap-guangzhou.myqcloud.com
      # - COS_PATH_PREFIX=generated/
    volumes:
      - ./data/creds:/app/creds
